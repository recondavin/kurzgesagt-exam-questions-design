<!-- Biology's Mini Golf (bio/bio-golf.js) with Computer Science questions: cs/cs-deck.js gives bio/bio-board.js a deck of
     the real Higher Level exam questions 2020-2025 on chapters 6 and 7 as four-option cards. -->

<p data-mx-intro>Computer Science: ten holes against the examiner, from the CPU to the pixel, a real exam question before every putt.</p>
<p class="mx-levelpick" aria-label="Level"><a href="cs-golf.html?warm" data-mx-level="warm">Warm-up</a> · <a href="cs-golf.html" data-mx-level="exam">Exam questions</a></p>

<script>
(function () {
  // Warm-up (?warm) or the real exam questions: say which on the page, and mark the one you're on.
  var warm = /[?&]warm\b/.test(location.search);
  if (warm) document.querySelector('[data-mx-intro]').textContent = 'Warm-up: short basics from every topic before every putt, to get going before the real exam questions.';
  document.querySelectorAll('[data-mx-level]').forEach(function (a) { if ((a.getAttribute('data-mx-level') === 'warm') === warm) a.setAttribute('aria-current', 'page'); });
  document.title = (warm ? 'Warm-up ' : '') + document.title;
})();
</script>
