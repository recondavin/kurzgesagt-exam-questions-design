<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games | Leaving Cert Computer Science</title>
<meta name="description" content="Games against the examiner with real Higher Level Computer Science exam questions: Trivia board, Outrun the Examiner, Points Grid, Sea Battle, Cannon Duel and Topple the Examiner.">
<link rel="icon" href="assets/examiner/bro-icon.svg?v=1" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="bio/bio.css?v=mem-1">
<link rel="stylesheet" href="bio/bio-shell.css?v=eng-108">
<style>
  .mx-levelpick { font: 700 17px Nunito, sans-serif; }
  .mx-levelpick a { color: inherit; }
  .mx-levelpick a[aria-current="page"] { color: #FFC800; text-decoration: none; }
</style>
</head>
<body class="mg-page">
<!-- Biology's turn-by-turn games (bio/bio-board.js, bio/bio-quizgames.js, bio/bio-arcade.js) with Computer Science
     questions: cs/cs-deck.js gives the board a deck of the real Higher Level exam parts on chapters 6 and 7.
     cs-play.html?g=board | chase | grid | sea | cannon | tower opens that game. -->
<main class="mg-land">
<h1 data-cs-game>Games</h1>
<p data-cs-intro>Computer Science: a real exam question every turn.</p>
<p class="mx-levelpick" aria-label="Level" data-cs-levels hidden><a data-mx-level="warm">Warm-up</a> · <a data-mx-level="exam">Exam questions</a></p>
<button type="button" class="tb-btn tb-btn--go" data-cs-play>Play</button>
<p><a href="computer-science.html#games">Back to Computer Science</a></p>
</main>
<script src="./examiner-art.js?v=teacher-15"></script>
<script src="./answer-mode.js?v=answer-mode-48"></script>
<script src="./cs/cs-cards.js?v=cs-3"></script>
<script src="./cs/cs-deck.js?v=mem-1"></script>
<script src="./bio/bio-games.js?v=eng-108"></script>
<script src="./bio/bio-board.js?v=mem-1"></script>
<script src="./bio/bio-quizgames.js?v=mem-1"></script>
<script src="./bio/vendor/matter.min.js?v=bio-91"></script>
<script src="./bio/bio-arcade.js?v=mem-1"></script>
<script>
(function () {
  var NAMES = { board: 'Trivia board', chase: 'Outrun the Examiner', grid: 'Points Grid', sea: 'Sea Battle', cannon: 'Cannon Duel', tower: 'Topple the Examiner' };
  var g = (/[?&]g=(\w+)/.exec(location.search) || [])[1] || 'board';
  if (!NAMES[g]) g = 'board';
  // Warm-up (?warm: short basics, window.CsWarm) or the real exam questions (window.CsCards).
  var warm = /[?&]warm\b/.test(location.search);
  document.querySelector('[data-cs-game]').textContent = NAMES[g];
  document.title = (warm ? 'Warm-up ' : '') + NAMES[g] + ' | Leaving Cert Computer Science';
  if (warm) document.querySelector('[data-cs-intro]').textContent = 'Warm-up: short basics from every topic, to get going before the real exam questions.';
  var levels = document.querySelector('[data-cs-levels]');
  if (window.CsWarm && Object.keys(window.CsWarm).length) levels.hidden = false;
  levels.querySelectorAll('[data-mx-level]').forEach(function (a) {
    var w = a.getAttribute('data-mx-level') === 'warm';
    a.href = 'cs-play.html?g=' + g + (w ? '&warm' : '');
    if (w === warm) a.setAttribute('aria-current', 'page');
  });
  function play() {
    if (g === 'board') { if (window.BioBoard) window.BioBoard.open(); }
    else if (g === 'chase' || g === 'grid') { if (window.BioQuizGames) window.BioQuizGames.open(g); }
    else if (window.BioArcade) window.BioArcade.open(g);
  }
  document.querySelector('[data-cs-play]').addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
