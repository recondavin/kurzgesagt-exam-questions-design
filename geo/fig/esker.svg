<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="esker-t esker-d" font-family="Lexend, Nunito, sans-serif" font-weight="600">
<title id="esker-t">Esker: a ridge of sorted sand and gravel</title>
<desc id="esker-d">Meltwater flowing in a tunnel under a glacier drops sand and gravel in layers on the tunnel floor; when the ice melts these sorted, stratified deposits are left as a long, winding, steep-sided ridge called an esker, like the Esker Riada across the Irish midlands.</desc>
<style>@media (prefers-reduced-motion: reduce){.amb{display:none}}</style>
