<svg xmlns="http://www.w3.org/2000/svg" id="gf-convection" viewBox="0 0 1600 900" role="img" aria-labelledby="gf-convection-t gf-convection-d">
<title id="gf-convection-t">Convection currents in the mantle</title>
<desc id="gf-convection-d">Heat from the core makes hot, less dense rock in the mantle rise, spread out under the crust and sink again as it cools; these convection currents drag the plates of the crust apart where they rise, and magma fills the gap to make new crust.</desc>
<style>@media (prefers-reduced-motion: reduce){#gf-convection .flow,#gf-convection .draw{stroke-dashoffset:0!important}#gf-convection .rise,#gf-convection .ripple{display:none}}</style>
