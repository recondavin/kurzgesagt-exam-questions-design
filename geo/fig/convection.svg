/><path d="M462 715L426.8 732.6L426.8 697.4Z" fill="#FFE066"/><path d="M120 507L102.4 471.8L137.6 471.8Z" fill="#FFE066"/><path d="M720 503L737.6 538.2L702.4 538.2Z" fill="#FFE066"/><path d="M1222 295L1186.8 312.6L1186.8 277.4Z" fill="#FFE066"/><path d="M1138 715L1173.2 697.4L1173.2 732.6Z" fill="#FFE066"/><path d="M1480 507L1462.4 471.8L1497.6 471.8Z" fill="#FFE066"/><path d="M880 503L897.6 538.2L862.4 538.2Z" fill="#FFE066"/><circle class="rise" cx="794" cy="740" r="8" fill="#FFE066" opacity="0"><animate attributeName="cy" values="740;290" dur="10s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle class="rise" cx="806" cy="740" r="8" fill="#FFE066" opacity="0"><animate attributeName="cy" values="740;290" dur="10s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="10s" begin="2.5s" repeatCount="indefinite"/></circle><circle class="rise" cx="794" cy="740" r="8" fill="#FFE066" opacity="0"><animate attributeName="cy" values="740;290" dur="10s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="10s" begin="5s" repeatCount="indefinite"/></circle><circle class="rise" cx="806" cy="740" r="8" fill="#FFE066" opacity="0"><animate attributeName="cy" values="740;290" dur="10s" begin="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="10s" begin="7.5s" repeatCount="indefinite"/></circle><path d="M560 225L334 225L334 212L300 234L334 256L334 243L560 243Z" fill="#FFFFFF" stroke="#13233A" stroke-width="3" stroke-linejoin="round"/><path d="M1040 243L1266 243L1266 256L1300 234L1266 212L1266 225L1040 225Z" fill="#FFFFFF" stroke="#13233A" stroke-width="3" stroke-linejoin="round"/><g font-family="Lexend, Nunito, sans-serif" font-weight="600" fill="#13233A" text-anchor="middle">
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/><path d="M420 836L560 836" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M420 836L560 836" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="560" cy="836" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="310.5" y="800" width="219" height="72" rx="22" fill="#FFFFFF"/><text x="420" y="830" font-size="24">CORE</text><text x="420" y="858" font-size="19">heats the mantle</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/><path d="M420 470L420 560" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M420 470L420 560" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="420" cy="560" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="263.5" y="434" width="313" height="72" rx="22" fill="#FFFFFF"/><text x="420" y="464" font-size="24">MANTLE</text><text x="420" y="492" font-size="19">hot rock that flows slowly</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/><path d="M210 64L150 232" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M210 64L150 232" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="150" cy="232" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="93.5" y="28" width="233" height="72" rx="22" fill="#FFFFFF"/><text x="210" y="58" font-size="24">CRUST</text><text x="210" y="86" font-size="19">broken into plates</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/><path d="M1180 450L800 450" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1180 450L800 450" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="800" cy="450" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1025" y="414" width="310" height="72" rx="22" fill="#FFFFFF"/><text x="1180" y="444" font-size="24">RISING CURRENT</text><text x="1180" y="472" font-size="19">hot, less dense rock rises</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/><path d="M1180 590L1480 590" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1180 590L1480 590" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="1480" cy="590" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1029" y="554" width="302" height="72" rx="22" fill="#FFFFFF"/><text x="1180" y="584" font-size="24">SINKING CURRENT</text><text x="1180" y="612" font-size="19">cooler, denser rock sinks</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.6s" fill="freeze"/><path d="M1270 64L1220 232" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1270 64L1220 232" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="1220" cy="232" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1121" y="28" width="298" height="72" rx="22" fill="#FFFFFF"/><text x="1270" y="58" font-size="24">Plates move apart</text><text x="1270" y="86" font-size="19">dragged by the currents</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.6s" fill="freeze"/><path d="M800 64L800 168" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M800 64L800 168" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="800" cy="168" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="670.5" y="28" width="259" height="72" rx="22" fill="#FFFFFF"/><text x="800" y="58" font-size="24">New crust forms</text><text x="800" y="86" font-size="19">magma fills the gap</text></g>
</g>
</svg>
