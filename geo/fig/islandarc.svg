<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="islandarc-t islandarc-d">
<title id="islandarc-t">Destructive plate boundary: oceanic and oceanic</title>
<desc id="islandarc-d">Where two oceanic plates meet, the older, denser plate is subducted at an ocean trench; it melts in the mantle and the rising magma builds a curved chain of volcanic islands, an island arc, as in Japan.</desc>
<style>@media (prefers-reduced-motion: reduce){.flow,.draw{stroke-dashoffset:0!important}.rise,.ripple{display:none}#mc{rx:50px!important;ry:18px!important}}</style>
