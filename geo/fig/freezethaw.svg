<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="freezethaw-t freezethaw-d" font-family="Lexend, Nunito, sans-serif" font-weight="600"><title id="freezethaw-t">Freeze-thaw weathering</title><desc id="freezethaw-d">Freeze-thaw in three stages: by day water seeps into a crack in the rock, at night it freezes and expands by about 9 percent, pressing on the crack and widening it, and after many cycles angular fragments break off and collect as scree at the foot of the slope.</desc><rect width="1600" height="900" fill="#FFFFFF"/><clipPath id="ft-p0"><rect x="25" y="25" width="500" height="500" rx="22"/></clipPath><g clip-path="url(#ft-p0)"><rect x="25" y="25" width="500" height="500" fill="#45C4EE"/><circle cx="99" cy="137" r="30" fill="#FFC42E"/><circle cx="99" cy="137" r="42" fill="none" stroke="#FFE066" stroke-width="5" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" from="0 99 137" to="360 99 137" dur="30s" repeatCount="indefinite"/></circle><g transform="translate(465 200) scale(0.45)" fill="#FDF7E8"><ellipse cx="0" cy="0" rx="70" ry="30"/><circle cx="-30" cy="-18" r="30"/><circle cx="18" cy="-28" r="38"/><circle cx="55" cy="-6" r="26"/></g><path d="M25,300 L299,300 L315,440 L315,525 L25,525 Z" fill="#6B2D4A"/><path d="M331,300 L425,300 L425,525 L315,525 L315,440 Z" fill="#6B2D4A"/><polygon points="299,300 331,300 315,440" fill="#241428"/><g stroke="#5B3A5E" stroke-width="4" fill="none" stroke-linecap="round"><path d="M65,380 L135,372"/><path d="M85,460 L175,470"/><path d="M195,420 L245,430"/></g><polygon points="307,370 323,370 315,440" fill="#4FC3E8"/><circle cx="315" cy="200" r="6" fill="#4FC3E8"><animate attributeName="cy" values="200;370" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><circle cx="315" cy="200" r="6" fill="#4FC3E8"><animate attributeName="cy" values="200;370" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="315" cy="200" r="6" fill="#4FC3E8"><animate attributeName="cy" values="200;370" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle></g><rect x="25" y="25" width="500" height="500" rx="22" fill="none" stroke="#13233A" stroke-width="2"/><clipPath id="ft-p1"><rect x="550" y="25" width="500" height="500" rx="22"/></clipPath><g clip-path="url(#ft-p1)"><rect x="550" y="25" width="500" height="500" fill="#1F2E52"/><path d="M620,105 a34,34 0 1 0 22,60 a28,28 0 1 1 -22,-60 z" fill="#FDF7E8"/><circle cx="610" cy="220" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="700" cy="190" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="950" cy="140" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle><circle cx="990" cy="230" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="1020" cy="300" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="1010" cy="400" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle><path d="M550,300 L814,300 L840,470 L840,525 L550,525 Z" fill="#6B2D4A"/><path d="M866,300 L950,300 L950,525 L840,525 L840,470 Z" fill="#6B2D4A"/><polygon points="814,300 866,300 840,470" fill="#241428"/><g stroke="#5B3A5E" stroke-width="4" fill="none" stroke-linecap="round"><path d="M590,380 L660,372"/><path d="M610,460 L700,470"/><path d="M720,420 L770,430"/><