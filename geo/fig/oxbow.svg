<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="oxbow-t oxbow-d" font-family="Lexend, Nunito, sans-serif" font-weight="600">
<title id="oxbow-t">Oxbow lake in three stages</title>
<desc id="oxbow-d">Three stages in plan view: erosion on the outer bends narrows the neck of a meander while deposition builds up the inner bends, in a flood the river cuts through the narrow neck, and deposition seals off the old loop as an oxbow lake beside the new straight channel.</desc>
<style>@media (prefers-reduced-motion: reduce){.amb{display:none}}</style>
