<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="waterfall-t waterfall-d" font-family="Lexend, Nunito, sans-serif" font-weight="600">
<title id="waterfall-t">Waterfall, plunge pool and gorge in three stages</title>
<desc id="waterfall-d">Three stages of a waterfall where a band of hard rock lies over soft rock: the soft rock is eroded faster, hydraulic action and abrasion deepen a plunge pool and undercut the soft rock, the hard-rock overhang collapses, and the waterfall retreats upstream leaving a steep-sided gorge.</desc>
<style>@media (prefers-reduced-motion: reduce){.amb{display:none}}</style>
