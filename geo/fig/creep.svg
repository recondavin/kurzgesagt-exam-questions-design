<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="creep-t creep-d" font-family="Lexend, Nunito, sans-serif" font-weight="600"><title id="creep-t">Soil creep</title><desc id="creep-d">A hillside affected by soil creep, the slowest mass movement: terracettes, trees with curved trunks, fence posts and poles leaning downslope, a wall bulging with soil piled up behind it and rock layers bent downslope, with an inset showing how heave lifts a particle at right angles to the slope and lets it fall straight down, so it moves slowly downslope.</desc><rect width="1600" height="900" fill="#45C4EE"/><rect y="300" width="1600" height="300" fill="#7FD8F2"/><g transform="translate(560 80) scale(0.7)" fill="#FDF7E8"><ellipse cx="0" cy="0" rx="70" ry="30"/><circle cx="-30" cy="-18" r="30"/><circle cx="18" cy="-28" r="38"/><circle cx="55" cy="-6" r="26"/></g><path d="M0,280 L110,311.6 L150,314.6 L162,326.6 L162,326.6 L202,329.6 L214,341.5 L214,341.5 L254,344.5 L266,356.5 L266,356.5 L306,359.5 L318,371.4 L318,371.4 L358,374.4 L370,386.4 L370,386.4 L410,389.4 L422,401.3 L1600,740 L1600,900 L0,900 Z" fill="#6B2D4A"/><clipPath id="cr-g"><path d="M0,280 L110,311.6 L150,314.6 L162,326.6 L162,326.6 L202,329.6 L214,341.5 L214,341.5 L254,344.5 L266,356.5 L266,356.5 L306,359.5 L318,371.4 L318,371.4 L358,374.4 L370,386.4 L370,386.4 L410,389.4 L422,401.3 L1600,740 L1600,900 L0,900 Z"/></clipPath><g clip-path="url(#cr-g)" stroke="#5B3A5E" stroke-width="7" fill="none" stroke-linecap="round"><path d="M-10,900 L20,427.8 Q26,367.8 90,371.8"/><path d="M60,900 L90,447.9 Q96,387.9 160,391.9"/><path d="M130,900 L160,468 Q166,408 230,412"/><path d="M200,900 L230,488.1 Q236,428.1 300,432.1"/><path d="M270,900 L300,508.3 Q306,448.3 370,452.3"/><path d="M340,900 L370,528.4 Q376,468.4 440,472.4"/><path d="M410,900 L440,548.5 Q446,488.5 510,492.5"/><path d="M480,900 L510,568.6 Q516,508.6 580,512.6"/><path d="M550,900 L580,588.8 Q586,528.8 650,5