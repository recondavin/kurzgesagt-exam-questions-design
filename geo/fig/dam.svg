<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="dam-t dam-d" font-family="Lexend, Nunito, sans-serif" font-weight="600"><title id="dam-t">A dam and its effects downstream</title><desc id="dam-d">A long profile of a dammed river like the Nile at Aswan: the reservoir behind the dam traps the sediment, clear water released below the dam erodes the river bed and banks, less silt reaches the floodplain, and the delta shrinks as the sea erodes it without new sediment.</desc><rect width="1600" height="900" fill="#45C4EE"/><rect y="260" width="1600" height="380" fill="#7FD8F2"/><g transform="translate(1000 90) scale(0.8)" fill="#FDF7E8"><ellipse cx="0" cy="0" rx="70" ry="30"/><circle cx="-30" cy="-18" r="30"/><circle cx="18" cy="-28" r="38"/><circle cx="55" cy="-6" r="26"/></g><g transform="translate(1420 150) scale(0.6)" fill="#FDF7E8"><ellipse cx="0" cy="0" rx="70" ry="30"/><circle cx="-30" cy="-18" r="30"/><circle cx="18" cy="-28" r="38"/><circle cx="55" cy="-6" r="26"/></g><path d="M0,120 L80,70 L160,140 L240,90 L330,200 L420,300 L0,300 Z" fill="#6BB553"/><path d="M0,300 C200,280 420,300 700,320 L700,640 L0,640 Z" fill="#A8D98A"/><path d="M780,612 C1000,604 1200,612 1360,620 L1360,700 L780,700 Z" fill="#83C468"/><g fill="#8FC63F"><rect x="880" y="618" width="80" height="14" rx="3"/><rect x="990" y="616" width="80" height="14" rx="3"/><rect x="1100" y="620" width="80" height="14" rx="3"/><rect x="1210" y="618" width="80" height="14" rx="3"/><rect x="1320" y="616" width="80" height="14" rx="3"/></g><path d="M0,300 L240,345 L700,620 L700,660 L800,704 L1100,712 L1350,714 L1470,694 L1560,820 L1600,834 L1600,900 L0,900 Z" fill="#6B2D4A"/><path d="M226,330 L700,330 L700,620 L240,345 Z" fill="#4FC3E8"/><path d="M260,340 L690,340" fill="none" stroke="#A8E4F5" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 40"><animate attributeName="stroke-dashoffset" from="0" to="-70" dur="9s" repeatCount="indefinite"/></path><path d="M240,345 L300,346 C360,348 400,360 440,400 C480,450 520,520 560,560 C610,590 660,604 700,606 L700,620 Z" fill="#B79C8A"/><g fill="#6B2D3A"><circle cx="300" cy="340" r="5"><animate attributeName="cy" values="340;352" dur="7s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="0s" repeatCount="indefinite"/></circle><circle cx="360" cy="340" r="5"><animate attributeName="cy" values="340;366" dur="7s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="1.4s" repeatCount="indefinite"/></circle><circle cx="420" cy="340" r="5"><animate attributeName="cy" values="340;398" dur="7s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="2.6s" repeatCount="indefinite"/></circle><circle cx="500" cy="340" r="5"><animate attributeName="cy" values="340;490" dur="7s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="3.6s" repeatCount="indefinite"/></circle><circle cx="580" cy="340" r="5"><animate attributeName="cy" values="340;568" dur="7s" begin="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="4.4s" repeatCount="indefinite"/></circle></g><path d="M0,292 L240,336" stroke="#4FC3E8" stroke-width="14" fill="none"/><path d="M0,292 L240,336" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 20"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="3s" repeatCount="indefinite"/></path><g fill="#6B2D3A"><circle r="4"><animateMotion path="M0,292 L240,336" dur="5s" begin="0s" repeatCount="indefinite"/></circle><circle r="4"><animateMotion path="M0,292 L240,336" dur="5s" begin="1.25s" repeatCount="indefinite"/></circle><circle r="4"><animateMotion path="M0,292 L240,336" dur="5s" begin="2.5s" repeatCount="indefinite"/></circle><circle r="4"><animateMotion path="M0,292 L240,336" dur="5s" begin="3.75s" repeatCount="indefinite"/></circle></g><path d="M700,300 L730,300 L802,706 L700,660 Z" fill="#B6ADC4"/><path d="M700,300 L730,300" stroke="#13233A" stroke-width="3"/><path d="M704,560 L790,640" stroke="#5B3A5E" stroke-width="14"/><rect x="780" y="618" width="60" height="44" fill="#5B3A5E"/><rect x="800" y="600" width="20" height="18" fill="#5B3A5E"/><path d="M800,652 L1100,664 L1350,690 L1350,714 L1100,712 L800,704 Z" fill="#4FC3E8"/><path d="M840,662 L1100,672 L1340,696" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 20"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2.6s" repeatCount="indefinite"/></path><path d="M800,680 L1100,700 L1350,712" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 10"/><g fill="#6B2D4A"><path d="M830,704 q20,-10 40,0 z"/><path d="M960,708 q20,-10 40,0 z"/></g><path d="M1350,690 L1600,690 L1600,834 L1560,820 L1470,694 L1350,714 Z" fill="#4FC3E8"/><path d="M1350,714 L1470,694 L1560,820 L1600,834 L1600,900 L1350,900 Z" fill="#F7D08A"/><path d="M1470,694 L1530,694 L1600,780" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 10"/><path d="M1500,682 q20,-14 40,0 t40,0" fill="none" stroke="#FFFFFF" stroke-width="5"><animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="5s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/><line x1="120" y1="228" x2="120" y2="314" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="120" y1="228" x2="120" y2="314" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="120" cy="314" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="58.5" y="164" width="183" height="64" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="150" y="191.7" font-size="22" text-anchor="middle" fill="#13233A">RIVER</text><text x="150" y="216.3" font-size="18" text-anchor="middle" fill="#13233A">Carries sediment</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/><line x1="470" y1="232" x2="470" y2="360" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="470" y1="232" x2="470" y2="360" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="470" cy="360" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="380.5" y="168" width="179" height="64" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="470" y="195.7" font-size="22" text-anchor="middle" fill="#13233A">RESERVOIR</text><text x="470" y="220.3" font-size="18" text-anchor="middle" fill="#13233A">e.g. Lake Nasser</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/><line x1="415" y1="528" x2="450" y2="420" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="415" y1="528" x2="450" y2="420" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="450" cy="420" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="169" y="528" width="262" height="64" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="300" y="555.7" font-size="22" text-anchor="middle" fill="#13233A">SEDIMENT TRAPPED</text><text x="300" y="580.3" font-size="18" text-anchor="middle" fill="#13233A">Settles in the still water</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/><line x1="726" y1="228" x2="726" y2="320" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="726" y1="228" x2="726" y2="320" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="726" cy="320" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="657" y="164" width="286" height="64" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="800" y="191.7" font-size="22" text-anchor="middle" fill="#13233A">DAM</text><text x="800" y="216.3" font-size="18" text-anchor="middle" fill="#13233A">e.g. Aswan High Dam, Egypt</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/><line x1="845" y1="519" x2="820" y2="606" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="845" y1="519" x2="820" y2="606" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="820" cy="606" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="826" y="481" width="148" height="38" rx="19" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="900" y="507" font-size="20" text-anchor="middle" fill="#13233A">HEP station</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.6s" fill="freeze"/><line x1="1046.5" y1="451" x2="900" y2="664" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1046.5" y1="451" x2="900" y2="664" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="900" cy="664" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1030.5" y="389" width="239" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1150" y="415" font-size="20" text-anchor="middle" fill="#13233A">Clear water released</text><text x="1150" y="439.3" font-size="18" text-anchor="middle" fill="#13233A">Has energy to erode</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.6s" fill="freeze"/><line x1="940" y1="779" x2="940" y2="708" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="940" y1="779" x2="940" y2="708" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="940" cy="708" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="841.5" y="779" width="277" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="980" y="805" font-size="20" text-anchor="middle" fill="#13233A">Bed and banks eroded</text><text x="980" y="829.3" font-size="18" text-anchor="middle" fill="#13233A">Original bed shown dashed</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.6s" fill="freeze"/><line x1="1150" y1="571" x2="1150" y2="618" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1150" y1="571" x2="1150" y2="618" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1150" cy="618" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1028" y="509" width="244" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1150" y="535" font-size="20" text-anchor="middle" fill="#13233A">Less silt for farmland</text><text x="1150" y="559.3" font-size="18" text-anchor="middle" fill="#13233A">Farmers use fertiliser</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.6s" fill="freeze"/><line x1="1516" y1="344" x2="1516" y2="750" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1516" y1="344" x2="1516" y2="750" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1516" cy="750" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1344.5" y="256" width="231" height="88" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1460" y="283.7" font-size="22" text-anchor="middle" fill="#13233A">DELTA SHRINKS</text><text x="1460" y="308.3" font-size="18" text-anchor="middle" fill="#13233A">Less sediment arrives,</text><text x="1460" y="332.3" font-size="18" text-anchor="middle" fill="#13233A">the sea erodes it</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.6s" fill="freeze"/><line x1="1541" y1="842" x2="1582" y2="800" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1541" y1="842" x2="1582" y2="800" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1582" cy="800" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1361" y="842" width="198" height="36" rx="18" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1460" y="866.3" font-size="18" text-anchor="middle" fill="#13233A">Former delta front</text></g></svg>