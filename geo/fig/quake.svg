<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/><path d="M1260 110L973.2 330" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1260 110L973.2 330" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="973.2" cy="330" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1102.5" y="74" width="315" height="72" rx="22" fill="#FFFFFF"/><text x="1260" y="104" font-size="24">FAULT LINE</text><text x="1260" y="132" font-size="19">a crack where rocks move</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/><path d="M1290 420L949.4 493.5" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1290 420L949.4 493.5" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="949.4" cy="493.5" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1087" y="384" width="406" height="72" rx="22" fill="#FFFFFF"/><text x="1290" y="414" font-size="24">Rocks move along the fault</text><text x="1290" y="442" font-size="19">stress builds until they slip</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/><path d="M330 650L760.7 640" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M330 650L760.7 640" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="760.7" cy="640" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="101" y="614" width="458" height="72" rx="22" fill="#FFFFFF"/><text x="330" y="644" font-size="24">FOCUS (HYPOCENTRE)</text><text x="330" y="672" font-size="19">where the rocks snap: the quake starts</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/><path d="M520 110L772.7 300" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M520 110L772.7 300" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="772.7" cy="300" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="288" y="74" width="464" height="72" rx="22" fill="#FFFFFF"/><text x="520" y="104" font-size="24">EPICENTRE</text><text x="520" y="132" font-size="19">on the surface, directly above the focus</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/><path d="M1270 640L1089.3 749.7" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1270 640L1089.3 749.7" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="1089.3" cy="749.7" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1107.5" y="604" width="325" height="72" rx="22" fill="#FFFFFF"/><text x="1270" y="634" font-size="24">SEISMIC WAVES</text><text x="1270" y="662" font-size="19">spread out in all directions</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.6s" fill="freeze"/><path d="M300 430L668.7 318" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M300 430L668.7 318" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="668.7" cy="318" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="142.5" y="394" width="315" height="72" rx="22" fill="#FFFFFF"/><text x="300" y="424" font-size="24">Shaking is strongest</text><text x="300" y="452" font-size="19">near the epicentre</text></g>
