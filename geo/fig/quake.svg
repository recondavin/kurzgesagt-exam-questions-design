<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="quake-t quake-d">
<title id="quake-t">Earthquake: focus, epicentre and seismic waves</title>
<desc id="quake-d">Stress builds up until rocks snap and slip along a fault line; the point where this happens underground is the focus, the point on the surface directly above it is the epicentre, and seismic waves spread out from the focus in all directions.</desc>
<style>@media (prefers-reduced-motion: reduce){.flow,.draw{stroke-dashoffset:0!important}.rise,.ripple{display:none}}</style>
