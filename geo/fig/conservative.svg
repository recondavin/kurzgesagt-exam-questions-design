<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="conservative-t conservative-d">
<title id="conservative-t">Conservative plate boundary: plates sliding past</title>
<desc id="conservative-d">Seen from above, two plates slide past each other along a fault line, such as the San Andreas Fault, so crust is neither made nor destroyed; the plates stick and then jerk free, causing earthquakes, and features such as rivers are offset across the fault.</desc>
<style>@media (prefers-reduced-motion: reduce){.flow,.draw{stroke-dashoffset:0!important}.rise,.ripple{display:none}}</style>
