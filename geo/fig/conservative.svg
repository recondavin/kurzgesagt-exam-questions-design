" stroke="#6BB553" stroke-width="8" stroke-linecap="round" stroke-dasharray="70 40" ><animate attributeName="stroke-dashoffset" values="330;0" dur="22s" repeatCount="indefinite"/></path><path d="M1218.5 138Q1046.5 342 808.9 445.2L718.1 350.8Q558.5 408 452.5 550" fill="none" stroke="#4FC3E8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path class="flow" d="M1218.5 138Q1046.5 342 808.9 445.2L718.1 350.8Q558.5 408 452.5 550" fill="none" stroke="#A8E4F5" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 30" ><animate attributeName="stroke-dashoffset" values="144;0" dur="10s" repeatCount="indefinite"/></path><path d="M465 0L1140 900" stroke="#6B2D3A" stroke-width="10"/><circle cx="1045.5" cy="774" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/><circle cx="1045.5" cy="774" r="78" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/><circle class="ripple" cx="1045.5" cy="774" r="12" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0"><animate attributeName="r" values="12;110" dur="4.5s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle><circle class="ripple" cx="1045.5" cy="774" r="12" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0"><animate attributeName="r" values="12;110" dur="4.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle><circle class="ripple" cx="1045.5" cy="774" r="12" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0"><animate attributeName="r" values="12;110" dur="4.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="4.5s" begin="3s" repeatCount="indefinite"/></circle><path d="M1065.5 774.0L1053.8 777.4L1059.6 788.1L1048.9 782.3L1045.5 794.0L1042.1 782.3L1031.4 788.1L1037.2 777.4L1025.5 774.0L1037.2 770.6L1031.4 759.9L1042.1 765.7L1045.5 754.0L1048.9 765.7L1059.6 759.9L1053.8 770.6Z" fill="#FFFFFF" stroke="#13233A" stroke-width="2.5" stroke-linejoin="round"/><path d="M588 364L442.8 170.4L454.8 161.4L412 146L414.8 191.4L426.8 182.4L572 376Z" fill="#FFFFFF" stroke="#13233A" stroke-width="3" stroke-linejoin="round"/><path d="M963 464L1108.2 657.6L1096.2 666.6L1139 682L1136.2 636.6L1124.2 645.6L979 452Z" fill="#FFFFFF" stroke="#13233A" stroke-width="3" stroke-linejoin="round"/><circle cx="1530" cy="100" r="46" fill="#FFFFFF"/><path d="M1530 94L1543 136L1530 128L1517 136Z" fill="#13233A"/><text x="1530" y="87" font-family="Lexend, Nunito, sans-serif" font-weight="600" font-size="22" fill="#13233A" text-anchor="middle">N</text><g font-family="Lexend, Nunito, sans-serif" font-weight="600" fill="#13233A" text-anchor="middle">
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/><path d="M1010 92L539.3 99" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1010 92L539.3 99" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="539.3" cy="99" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="812" y="56" width="396" height="72" rx="22" fill="#FFFFFF"/><text x="1010" y="86" font-size="24">FAULT LINE</text><text x="1010" y="114" font-size="19">e.g. San Andreas Fault, California</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/><path d="M190 420L496 258" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M190 420L496 258" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="496" cy="258" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="74.5" y="384" width="231" height="72" rx="22" fill="#FFFFFF"/><text x="190" y="414" font-size="24">PACIFIC PLATE</text><text x="190" y="442" font-size="19">moves north-west</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/><path d="M1340 450L1055 570" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1340 450L1055 570" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="1055" cy="570" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1154" y="414" width="372" height="72" rx="22" fill="#FFFFFF"/><text x="1340" y="444" font-size="24">NORTH AMERICAN PLATE</text><text x="1340" y="472" font-size="19">moves south-east relative to it</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/><path d="M420 830L971.3 675" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M420 830L971.3 675" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="971.3" cy="675" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="213" y="794" width="414" height="72" rx="22" fill="#FFFFFF"/><text x="420" y="824" font-size="24">Plates slide past each other</text><text x="420" y="852" font-size="19">no crust is made or destroyed</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/><path d="M1330 800L1069.5 774" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M1330 800L1069.5 774" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="1069.5" cy="774" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="1094.5" y="764" width="471" height="72" rx="22" fill="#FFFFFF"/><text x="1330" y="794" font-size="24">EARTHQUAKE</text><text x="1330" y="822" font-size="19">plates stick, stress builds, they jerk free</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.6s" fill="freeze"/><path d="M260 560L763.5 398" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M260 560L763.5 398" stroke="#13233A" stroke-width="2.5" fill="none"/><circle cx="763.5" cy="398" r="6" fill="#13233A" stroke="#FFFFFF" stroke-width="2.5"/><rect x="68" y="524" width="384" height="72" rx="22" fill="#FFFFFF"/><text x="260" y="554" font-size="24">Offset river</text><text x="260" y="582" font-size="19">shows how far the plates moved</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.6s" fill="freeze"/><rect x="69.5" y="678" width="241" height="44" rx="22" fill="#FFFFFF"/><text x="190" y="708.5" font-size="24">PACIFIC OCEAN</text></g>
<g class="lab" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.6s" fill="freeze"/><rect x="1197" y="174" width="266" height="44" rx="22" fill="#FFFFFF"/><text x="1330" y="204.5" font-size="24">Seen from above</text></g>
</g>
</svg>
