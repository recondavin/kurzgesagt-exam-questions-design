<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cliff-t cliff-d" font-family="Lexend, Nunito, sans-serif" font-weight="600">
<title id="cliff-t">Sea cliff, wave-cut notch and wave-cut platform</title>
<desc id="cliff-d">A cross-section of a sea cliff: waves at high tide cut a wave-cut notch by hydraulic action and abrasion, the overhang above collapses, and the cliff retreats inland, leaving a gently sloping wave-cut platform that is exposed at low tide.</desc>
<style>@media (prefers-reduced-motion: reduce){.amb{display:none}}</style>
