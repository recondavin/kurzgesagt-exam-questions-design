<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="tombolo-t tombolo-d" font-family="Lexend, Nunito, sans-serif" font-weight="600">
<title id="tombolo-t">Tombolo joining an island to the mainland</title>
<desc id="tombolo-d">Two stages in plan view: waves bend around an offshore island and longshore drift carries sand into the sheltered water behind it, where a spit grows out from the mainland until it joins the island as a tombolo.</desc>
