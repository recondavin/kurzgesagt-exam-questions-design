<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="exfoliation-t exfoliation-d" font-family="Lexend, Nunito, sans-serif" font-weight="600"><title id="exfoliation-t">Exfoliation (insolation weathering)</title><desc id="exfoliation-d">A rock dome in a hot desert: by day the sun heats the outer layer, which expands, and at night it cools and contracts, while the inside stays at a steadier temperature because rock is a poor conductor of heat; the stress opens cracks parallel to the surface and the outer layers peel off like the skin of an onion.</desc><rect width="800" height="900" fill="#45C4EE"/><rect x="800" width="800" height="900" fill="#1F2E52"/><rect y="560" width="800" height="210" fill="#7FD8F2"/><rect x="800" y="560" width="800" height="210" fill="#2E4170"/><circle cx="120" cy="120" r="48" fill="#FFC42E"/><circle cx="120" cy="120" r="64" fill="none" stroke="#FFE066" stroke-width="6" stroke-dasharray="10 12"><animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="40s" repeatCount="indefinite"/></circle><path d="M1500,72 a46,46 0 1 0 30,82 a38,38 0 1 1 -30,-82 z" fill="#FDF7E8"/><circle cx="900" cy="80" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="1000" cy="200" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="1120" cy="60" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle><circle cx="1240" cy="170" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="1580" cy="260" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="1440" cy="300" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle><circle cx="960" cy="380" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="1300" cy="40" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle><path d="M1140,770 A340,330 0 0 0 460,770 Z" fill="#EBA5B0"/><g fill="#6B2D4A"><rect x="700" y="650" width="9" height="7" transform="rotate(25 700 650)"/><rect x="760" y="560" width="9" height="7" transform="rotate(25 760 560)"/><rect x="860" y="600" width="9" height="7" transform="rotate(25 860 600)"/><rect x="900" y="700" width="9" height="7" transform="rotate(25 900 700)"/><rect x="640" y="720" width="9" height="7" transform="rotate(25 640 720)"/><rect x="820" y="700" width="9" height="7" transform="rotate(25 820 700)"/><rect x="980" y="640" width="9" height="7" transform="rotate(25 980 640)"/><rect x="720" y="480" width="9" height="7" transform="rotate(25 720 480)"/><rect x="880" y="500" width="9" height="7" transform="rotate(25 880 500)"/><rect x="600" y="600" width="9" height="7" transform="rotate(25 600 600)"/></g><g fill="none" stroke="#6B2D4A" stroke-width="4"><path d="M500.2,759.9 A300,290 0 0 1 1099.8,759.9"/><path d="M538.6,752.4 A262,252 0 0 1 1061.4,752.4"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;16 -14" dur="6s" begin="3s" fill="freeze"/><path d="M1115.2,646.4 A340,330 0 0 0 959.6,478.6 L940.8,513.9 A300,290 0 0 1 1078.2,661.4 Z" fill="#EBA5B0" stroke="#6B2D4A" stroke-width="4"/></g><path d="M1115.2,646.4 A340,330 0 0 0 959.6,478.6 L940.8,513.9 A300,290 0 0 1 1078.2,661.4 Z" fill="#241428" opacity="0.0"><animate attributeName="opacity" values="0;0.85" dur="6s" begin="3s" fill="freeze"/></path><path d="M0,756 C200,740 400,744 800,758 L800,900 L0,900 Z" fill="#F7D08A"/><path d="M800,758 C1100,746 1300,740 1600,752 L1600,900 L800,900 Z" fill="#E7B565"/><path d="M1150,770 C1160,730 1190,706 1222,700 L1232,716 C1204,724 1180,744 1174,772 Z" fill="#EBA5B0" stroke="#6B2D4A" stroke-width="3"/><path d="M1196,772 C1214,752 1246,742 1276,744 L1278,760 C1254,760 1228,766 1214,776 Z" fill="#EBA5B0" stroke="#6B2D4A" stroke-width="3"/><path d="M404,772 C410,750 430,734 456,728 L462,742 C442,748 428,758 424,774 Z" fill="#EBA5B0" stroke="#6B2D4A" stroke-width="3"/><polygon points="687.3,452.2 673,412.7 681.4,409.6 659.8,394.1 653.2,419.9 661.7,416.8 676.1,456.4" fill="#E8551F" stroke="#13233A" stroke-width="2.5" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;-2.6 -7.2;0 0" dur="4s" repeatCount="indefinite"/></polygon><polygon points="559.5,528.2 529.9,498.5 536.3,492.1 510.1,487.2 515,513.4 521.4,507 551.1,536.6" fill="#E8551F" stroke="#13233A" stroke-width="2.5" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;-5.4 -5.4;0 0" dur="4s" repeatCount="indefinite"/></polygon><polygon points="477,649.5 437.4,635.1 440.5,626.6 414.7,633.2 430.2,654.8 433.3,646.4 472.8,660.7" fill="#E8551F" stroke="#13233A" stroke-width="2.5" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;-7.2 -2.6;0 0" dur="4s" repeatCount="indefinite"/></polygon><polygon points="934.6,392 920.9,429.7 912.4,426.6 919,452.4 940.6,436.9 932.2,433.8 945.8,396.2" fill="#4FC3E8" stroke="#13233A" stroke-width="2.5" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;-2.5 7;0 0" dur="4s" repeatCount="indefinite"/></polygon><polygon points="1194.5,660.7 1155.8,671 1153.5,662.3 1136.1,682.5 1161.2,691.3 1158.9,682.6 1197.5,672.3" fill="#4FC3E8" stroke="#13233A" stroke-width="2.5" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;-7.2 1.9;0 0" dur="4s" repeatCount="indefinite"/></polygon><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/><rect x="249.5" y="78" width="133" height="64" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="316" y="105.7" font-size="22" text-anchor="middle" fill="#13233A">HOT DAY</text><text x="316" y="130.3" font-size="18" text-anchor="middle" fill="#13233A">Up to 40°C</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/><rect x="1192.5" y="78" width="215" height="64" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1300" y="105.7" font-size="22" text-anchor="middle" fill="#13233A">COLD NIGHT</text><text x="1300" y="130.3" font-size="18" text-anchor="middle" fill="#13233A">Can fall close to 0°C</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/><line x1="337" y1="391" x2="620" y2="492" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="337" y1="391" x2="620" y2="492" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="620" cy="492" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="147" y="329" width="206" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="250" y="355" font-size="20" text-anchor="middle" fill="#13233A">Outer layer heats</text><text x="250" y="379.3" font-size="18" text-anchor="middle" fill="#13233A">and EXPANDS</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/><line x1="1264.5" y1="431" x2="1112" y2="690" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1264.5" y1="431" x2="1112" y2="690" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1112" cy="690" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1248.5" y="369" width="203" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1350" y="395" font-size="20" text-anchor="middle" fill="#13233A">Outer layer cools</text><text x="1350" y="419.3" font-size="18" text-anchor="middle" fill="#13233A">and CONTRACTS</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/><rect x="590.5" y="629" width="419" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="800" y="655" font-size="20" text-anchor="middle" fill="#13233A">Inside stays at a steadier temperature</text><text x="800" y="679.3" font-size="18" text-anchor="middle" fill="#13233A">Rock is a poor conductor of heat</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.6s" fill="freeze"/><line x1="322" y1="591" x2="518" y2="671" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="322" y1="591" x2="518" y2="671" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="518" cy="671" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="102" y="529" width="236" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="220" y="555" font-size="20" text-anchor="middle" fill="#13233A">Cracks form parallel</text><text x="220" y="579.3" font-size="18" text-anchor="middle" fill="#13233A">to the surface</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.6s" fill="freeze"/><line x1="1127.5" y1="294" x2="1010" y2="474" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1127.5" y1="294" x2="1010" y2="474" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1010" cy="474" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1111.5" y="206" width="217" height="88" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1220" y="233.7" font-size="22" text-anchor="middle" fill="#13233A">EXFOLIATION</text><text x="1220" y="258.3" font-size="18" text-anchor="middle" fill="#13233A">Outer layers peel off</text><text x="1220" y="282.3" font-size="18" text-anchor="middle" fill="#13233A">like an onion skin</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.6s" fill="freeze"/><line x1="1297" y1="789" x2="1236" y2="752" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5.5" stroke-linecap="round"/><line x1="1297" y1="789" x2="1236" y2="752" stroke="#13233A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1236" cy="752" r="4.5" fill="#13233A" stroke="#fff" stroke-width="1.5"/><rect x="1281" y="789" width="198" height="62" rx="16" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"/><text x="1380" y="815" font-size="20" text-anchor="middle" fill="#13233A">Curved slabs fall</text><text x="1380" y="839.3" font-size="18" text-anchor="middle" fill="#13233A">to the base</text></g></svg>