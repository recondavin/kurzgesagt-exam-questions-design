<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Golf | Leaving Cert English</title>
<meta name="description" content="Mini Golf against the examiner, with questions on your comparative texts.">
<link rel="icon" href="assets/examiner/teacher-head.svg?v=1" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="mg-page">
<!-- Biology's Mini Golf (bio/bio-golf.js) with English questions: eng/eng-deck.js gives bio/bio-board.js a deck
     (your three texts' key moments, Comparing and Say it well) before it loads. -->
<main class="mg-land">
<h1>Mini Golf</h1>
<p>English: five holes against the examiner, a question on your texts before every putt.</p>
<button type="button" class="tb-btn tb-btn--go" data-mg-play>Play</button>
<p><a href="english.html">Back to English</a></p>
</main>
<script src="./examiner-art.js?v=teacher-13"></script>
<script src="./answer-mode.js?v=answer-mode-48"></script>
<script src="./eng/eng-data.js?v=eng-73"></script>
<script src="./eng/eng-deck.js?v=eng-73"></script>
<script src="./bio/bio-games.js?v=eng-73"></script>
<script src="./bio/bio-board.js?v=eng-73"></script>
<script src="./bio/vendor/three.min.js?v=eng-73"></script>
<script src="./bio/golf-head.js?v=eng-73"></script>
<script src="./bio/bio-golf.js?v=eng-73"></script>
<script>
(function () {
  // One text's story (?story=sive): its title on the page, and back to that text.
  var B = window.BoardDeck;
  if (B && B.story) {
    document.title = 'Mini Golf | ' + B.title + ' | Leaving Cert English';
    document.querySelector('.mg-land p').textContent = B.sub;
    document.querySelector('.mg-land h1').textContent = 'Mini Golf: ' + B.title.replace(/: the whole story$/, '');
    document.querySelector('.mg-land a').setAttribute('href', 'english.html#text/' + B.story);
    document.querySelector('.mg-land a').textContent = 'Back to ' + B.title.replace(/: the whole story$/, '');
  }
  function play() { if (window.BioGolf) window.BioGolf.open(); }
  document.querySelector('[data-mg-play]').addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
